# Publishes a tagged release to npm through GitHub's OIDC trusted publisher,
# then to the official MCP registry the same way, so no token exists
# anywhere: not in repository secrets, not on a laptop. npm exchanges the job's identity token for a short-lived publish
# credential and attaches a provenance attestation. The package's settings
# on npmjs.com name this repository, this workflow file, and the `npm`
# environment as the only identity allowed to do that, and all three must
# match or the registry answers with an auth failure rather than a config
# error.
#
# Runs on a v* tag push. It can also be dispatched by hand with a tag name,
# which exists for one reason: a tag pushed before this workflow existed
# cannot trigger it.
#
# Two steps below look redundant and are not. npm is moved to 11.x because
# the token exchange needs 11.5.1 or newer; an older npm silently falls back
# to the placeholder token setup-node writes and the registry answers 404
# with nothing useful in it. And NODE_AUTH_TOKEN is never set: its presence
# disables the OIDC path.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, like v1.4.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@orygn/omnicord
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that can do the OIDC exchange
        run: npm install -g npm@^11

      # Every place the version is written must agree with the tag before
      # anything is published. A mismatch caught later, after npm accepted
      # the package, leaves a release half done.
      - name: Refuse a tag that does not match every version string
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"
          for pair in \
            "package.json:$(node -p "require('./package.json').version")" \
            "server.json:$(node -p "require('./server.json').version")" \
            "server.json packages[0]:$(node -p "require('./server.json').packages[0].version")" \
            "mcpb/manifest.json:$(node -p "require('./mcpb/manifest.json').version")"; do
            if [ "${pair##*:}" != "$WANT" ]; then
              echo "Tag $TAG does not match ${pair%:*} (${pair##*:})."
              exit 1
            fi
          done
          echo "All version strings are $WANT."

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs the full local suite (build, unit, stdio and
      # HTTP smoke) before the tarball leaves the runner, so a publish is
      # gated by the same tests as a commit, on the exact tagged source.
      - name: Publish
        run: npm publish --access public

  # The official MCP registry, authenticated the same tokenless way: the
  # registry accepts this repository's GitHub identity for the
  # io.github.OrygnsCode namespace. It validates server.json against the
  # npm package, so it runs after npm and waits until npm serves the new
  # version.
  publish-registry:
    name: Publish to the MCP registry
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Pinned to the version proven on earlier releases rather than
      # "latest", so a publisher release cannot change behavior mid-release.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Wait until npm serves this version
        run: |
          VERSION="$(jq -r .version server.json)"
          for attempt in $(seq 1 30); do
            if npm view "@orygn/omnicord@$VERSION" version > /dev/null 2>&1; then
              echo "npm serves $VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "npm did not serve $VERSION within five minutes."
          exit 1

      - name: Log in with this workflow's identity
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
